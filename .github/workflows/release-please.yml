name: release-please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - name: 🚀 release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}

      - name: 🛒 Checkout repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_PAT }}

      - name: ⚙️ Setup dotnet 10.0.x
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 🧹 Clean
        if: ${{ steps.release.outputs.release_created }}
        run: dotnet clean -c Release && dotnet nuget locals all --clear

      - name: 🔁 Restore packages
        if: ${{ steps.release.outputs.release_created }}
        run: dotnet restore

      - name: 🛠️ Building library in release mode
        if: ${{ steps.release.outputs.release_created }}
        run: dotnet build -c Release --no-restore /p:UseSourceLink=true

      - name: 🗳️ Creating library package for release
        if: ${{ steps.release.outputs.release_created }}
        run: dotnet pack src/LupusBytes.Aspire.Hosting.Azure.EventHubs.LiveExplorer/LupusBytes.Aspire.Hosting.Azure.EventHubs.LiveExplorer.csproj -c Release --no-restore -o ${GITHUB_WORKSPACE}/packages /p:PublicRelease=true

      - name: 🔑 NuGet login (OIDC → temporary API key)
        if: ${{ steps.release.outputs.release_created }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 📦 Push packages to NuGet
        if: ${{ steps.release.outputs.release_created }}
        run: |
          dotnet nuget push ${GITHUB_WORKSPACE}/packages/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols